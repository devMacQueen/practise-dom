    function scorePare(pare){
      let depth = 0
      let score = 0

      for (let i = 0; i < pare.length; i++ ){
        if (pare[i] === "("){
          depth++;
        } else {
          depth--;
          if (pare[i-1] === "("){
            score += 2 ** depth
          }
        }
      }
      return score
    }
